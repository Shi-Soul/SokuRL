jobs:
  - name: baseline
    training_directory: logs/training/br-dqn-reimu-baseline-resumed-20261001
    output: logs/benchmark/br-dqn-baseline-final-validation-20261001
  - name: five_step
    training_directory: logs/training/br-dqn-reimu-five-step-20261001
    output: logs/benchmark/br-dqn-five-step-final-validation-20261001
  - name: more_replay
    training_directory: logs/training/br-dqn-reimu-more-replay-20261001
