defaults:
  - benchmark_address_block_noise
  - _self_

# Frozen original BC reference; same block gate, roles and seeds as the parent.
training_directory: logs/pretraining/god-marisa-reimu-address-invariant-20261002
checkpoint: best.zip
algorithm:
  opponents:
    - name: god:0:character
      probability: 1.0
      setup: {character: 0, palette: 0, deck: 0}
      policy:
        kind: block_action_noise
        random_probability: 0.5
        block_decisions: 16
        policy:
          kind: rule
          name: god
          rules:
            roster: [god]
            god:
              package: ${rules.god.package}
              api_source: ${rules.god.api_source}
              script: character
output: logs/diagnostics/frozen-bc-block-noise-${now:%Y%m%d-%H%M%S}
